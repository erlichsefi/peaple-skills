name: Daily arena

# Once a day: generate fresh scenarios, run them against the current skills, commit the results.
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC, morning in Israel
  workflow_dispatch:
    inputs:
      count:
        description: Number of scenarios to generate
        default: "8"

permissions:
  contents: write

concurrency:
  group: daily-arena
  cancel-in-progress: false

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check LLM key
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Add a repository secret named LLM_API_KEY (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Generate scenarios
        run: python eval/arena.py generate --count "${{ inputs.count || '8' }}"

      - name: Evaluate
        run: python eval/arena.py evaluate --save --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios results
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Arena: $(date -u +%F) results"
          git pull --rebase
          git push
